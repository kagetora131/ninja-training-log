name: Supabase keepalive

# Supabaseの無料プロジェクトは7日間アクセスが無いと自動停止されるため、
# 3日おきにREST APIへ軽いリクエストを送って「アクティブ」状態を維持する。
# 併せて、SUPABASE_SERVICE_ROLE_KEY シークレットが設定されていれば
# デモデータの日付を現在基準へスライドさせる関数も呼び出す(任意)。

on:
  schedule:
    - cron: '23 15 */3 * *' # 3日おき 15:23 UTC (= 00:23 JST)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep project active
        env:
          SUPABASE_URL: https://rtecihjilnuhhgtpogdw.supabase.co
          # anon key はブラウザに公開される前提の公開鍵(RLSで保護)。ハードコードで問題ない。
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0ZWNpaGppbG51aGhndHBvZ2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3Mjk2ODEsImV4cCI6MjEwMzMwNTY4MX0.0kw9_MyKAUcS5PIjYsjha0eH5XeC3ymqWddItPksgfk
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/user_progress?select=user_id&limit=1" \
            -H "apikey: $ANON_KEY")
          echo "keepalive ping -> HTTP $code"
          test "$code" = "200"

      - name: Refresh demo data dates (optional)
        env:
          SUPABASE_URL: https://rtecihjilnuhhgtpogdw.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY 未設定 — デモデータのスライドはスキップ"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/slide_demo_data_to_present" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "slide_demo_data_to_present -> HTTP $code"
          case "$code" in 200|204) ;; *) exit 1 ;; esac
